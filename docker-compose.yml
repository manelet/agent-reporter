services:
  landing:
    build:
      context: .
      dockerfile: Dockerfile.landing
    restart: unless-stopped
    ports:
      - "80"

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - SERVER_HOST=0.0.0.0
      - PB_URL=${PB_URL:?}
      - PB_ADMIN_EMAIL=${PB_ADMIN_EMAIL:?}
      - PB_ADMIN_PASSWORD=${PB_ADMIN_PASSWORD:?}
      - ADMIN_ORIGIN=${ADMIN_ORIGIN:-https://admin.reporter.localhost}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - RESEND_FROM_ADDRESS=${RESEND_FROM_ADDRESS:-}
      - RESEND_TO_ADDRESSES=${RESEND_TO_ADDRESSES:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  admin:
    build:
      context: .
      dockerfile: Dockerfile.admin
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "80"
