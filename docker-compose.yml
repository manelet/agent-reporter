services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      SERVER_HOST: 0.0.0.0
      AGENT_REPORTER_MASTER_KEY: ${AGENT_REPORTER_MASTER_KEY}
      PB_URL: ${PB_URL}
      PB_ADMIN_EMAIL: ${PB_ADMIN_EMAIL}
      PB_ADMIN_PASSWORD: ${PB_ADMIN_PASSWORD}
      ADMIN_ORIGIN: ${ADMIN_ORIGIN}
      CRON_TIMEZONE: ${CRON_TIMEZONE:-Europe/Madrid}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  admin:
    build:
      context: .
      dockerfile: Dockerfile.admin
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "80"
